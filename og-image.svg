<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a252f"/>
      <stop offset="60%" style="stop-color:#2c1a1a"/>
      <stop offset="100%" style="stop-color:#3d0e0e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22"/>
      <stop offset="50%" style="stop-color:#c0392b"/>
      <stop offset="100%" style="stop-color:#ff6b5b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent line gauche -->
  <rect x="0" y="0" width="6" height="630" fill="#c0392b"/>

  <!-- Flamme icône -->
  <g transform="translate(90, 120)">
    <path d="M60 160 C20 130 10 80 40 40 C45 60 55 65 60 55 C65 30 80 10 100 0 C90 30 95 50 110 55 C115 35 125 25 140 30 C120 60 130 100 110 120 C105 95 90 90 85 100 C80 120 75 145 60 160Z" fill="url(#flame)" opacity="0.95"/>
    <ellipse cx="80" cy="145" rx="20" ry="8" fill="#e67e22" opacity="0.4"/>
  </g>

  <!-- Titre principal -->
  <text x="240" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">Diagnostic Sécurité Incendie</text>
  <text x="240" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="900" fill="#ff6b5b" letter-spacing="-1">100% Gratuit</text>

  <!-- Sous-titre -->
  <text x="240" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e0e0e0" opacity="0.85">Conformité ERP 2026 — Installateurs APSAD certifiés</text>

  <!-- Séparateur -->
  <rect x="240" y="358" width="700" height="2" fill="#c0392b" opacity="0.6"/>

  <!-- Bullets -->
  <circle cx="252" cy="405" r="6" fill="#c0392b"/>
  <text x="272" y="413" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#cccccc">Dévis comparatifs sous 24h</text>

  <circle cx="252" cy="450" r="6" fill="#c0392b"/>
  <text x="272" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#cccccc">Certifications APSAD R1 / R4 / R7</text>

  <circle cx="252" cy="495" r="6" fill="#c0392b"/>
  <text x="272" y="503" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#cccccc">Sans engagement — Grand Est &amp; France entière</text>

  <!-- Domaine -->
  <rect x="240" y="545" width="350" height="48" rx="24" fill="#c0392b"/>
  <text x="415" y="576" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">securiteincendiepro.fr</text>

  <!-- Décoration droite -->
  <rect x="1050" y="0" width="150" height="630" fill="#c0392b" opacity="0.08"/>
  <text x="1125" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" opacity="0.04" text-anchor="middle" transform="rotate(-90, 1125, 340)">APSAD</text>
